name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported distribution family, on the packages that distribution
          # ships. Ubuntu 24.04 has the oldest Qt and Open CASCADE that LCAD supports.
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y git ca-certificates
            preset: ci
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            bootstrap: apt-get update && apt-get install -y git ca-certificates
            preset: ci
          - name: Fedora 44
            image: fedora:44
            # The bare Fedora image has one monospace font. The 3D view's labels ask for a
            # sans-serif one, and OCCT warns when it has to substitute.
            bootstrap: dnf install -y git dejavu-sans-fonts dejavu-sans-mono-fonts
            preset: ci
          - name: Arch Linux
            image: archlinux:latest
            # The bare Arch image has no fonts, and without one Qt draws menu text as boxes.
            bootstrap: pacman -Syu --noconfirm git ttf-dejavu
            preset: ci
          - name: Sanitizers
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y git ca-certificates
            preset: asan
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        run: ${{ matrix.bootstrap }}

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./scripts/install-deps.sh --yes

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        # As an ordinary user, not as the root user of the container: one test saves into a
        # folder it is not allowed to write to, and root is allowed everything.
        #
        # $GITHUB_WORKSPACE, not the github.workspace context: inside a container job the
        # context still holds the path on the host.
        run: |
          useradd --create-home tester
          mkdir test-frames
          chown -R tester build test-frames
          runuser -u tester -- env LCAD_TEST_ARTIFACTS="$GITHUB_WORKSPACE/test-frames" \
              ctest --preset ${{ matrix.preset }}

      - name: Keep the frames the GUI tests rendered
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-${{ matrix.name }}
          path: test-frames
          if-no-files-found: ignore
          retention-days: 14

      # tests/models/ keeps one copy of this document per Open CASCADE version, and every job
      # reads all of them. The copy written here is how a new one gets there.
      - name: Write the reference document with this job's Open CASCADE
        # In the sanitizer build, the STEP translator's global tables count as leaks. The path is
        # set here, inside the container: github.workspace is the host's.
        run: |
          export LSAN_OPTIONS="suppressions=$PWD/tests/lsan.supp:print_suppressions=0"
          mkdir reference-model
          build/${{ matrix.preset }}/bin/lcad_write_reference_model \
            reference-model/primitives.lcad reference-model/bracket.step

      - name: Keep the reference document
        uses: actions/upload-artifact@v7
        with:
          name: reference-model-${{ matrix.name }}
          path: reference-model
          retention-days: 14

  # Windows and macOS build against conda-forge's Qt and Open CASCADE, which come built for
  # both: the same libraries, in the same versions, on the two.
  windows:
    name: Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Set up Visual Studio's compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: packaging/conda/environment.yml
          init-shell: powershell
          cache-environment: true

      - name: Configure
        run: >
          cmake --preset ci -DLCAD_WARNINGS_AS_ERRORS=OFF
          "-DCMAKE_PREFIX_PATH=$env:CONDA_PREFIX/Library"

      - name: Build
        # Keeps going past a file that does not compile, to report them all in one run.
        run: cmake --build --preset ci -- -k 0

      # The runner has no graphics card, and Windows' own OpenGL stops at version 1.1. Mesa's
      # software renderer, put beside the tests, takes its place for them.
      - name: Put Mesa's OpenGL beside the tests
        run: |
          $version = "26.2.3"
          Invoke-WebRequest -OutFile mesa.7z `
            "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          7z x mesa.7z -omesa | Out-Null
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll build/ci/bin/

      - name: Test
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          New-Item -ItemType Directory test-frames | Out-Null
          $env:LCAD_TEST_ARTIFACTS = "$PWD/test-frames"
          ctest --preset ci

      - name: Keep the frames the GUI tests rendered
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-Windows
          path: test-frames
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        run: scripts/build-windows-installer.ps1 -Output installer -Build build/ci

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: LCAD-Windows-installer
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      # With conda-forge's compiler, so that LCAD and the libraries share one C++ library.
      - name: Install dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: packaging/conda/environment.yml
          create-args: cxx-compiler
          cache-environment: true

      - name: Configure
        run: cmake --preset ci "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX"

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: |
          mkdir test-frames
          LCAD_TEST_ARTIFACTS="$PWD/test-frames" ctest --preset ci

      - name: Keep the frames the GUI tests rendered
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frames-macOS
          path: test-frames
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the disk image
        run: scripts/build-macos-dmg.sh dmg build/ci

      - name: Keep the disk image
        uses: actions/upload-artifact@v7
        with:
          name: LCAD-macOS-disk-image
          path: dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # One file that runs without installing anything. Built on the oldest supported distribution,
  # because an AppImage runs on distributions at least as new as the one it was built on.
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git ca-certificates

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          ./scripts/install-deps.sh --yes
          apt-get install -y --no-install-recommends curl file qmake6

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh appimage

      - name: Keep the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: LCAD-AppImage
          path: appimage/LCAD-*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The AppImage has to start on a distribution it was not built on, where neither Qt nor Open
  # CASCADE is installed.
  appimage-runs:
    name: AppImage runs on Fedora 44
    needs: appimage
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git, a virtual display, and what a desktop provides
        run: >
          dnf install -y git xorg-x11-server-Xvfb ImageMagick
          mesa-dri-drivers mesa-libGL mesa-libEGL
          libglvnd-glx libglvnd-egl libglvnd-opengl
          libX11 libX11-xcb libxcb libICE libSM libuuid
          fontconfig freetype harfbuzz expat zlib libgpg-error
          dejavu-sans-fonts dejavu-sans-mono-fonts

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: LCAD-AppImage
          path: appimage

      - name: Start LCAD from the AppImage and open a document
        run: |
          chmod +x appimage/LCAD-*.AppImage
          ./scripts/smoke-test-appimage.sh appimage/LCAD-*.AppImage \
              tests/models/format-1/primitives-occt-7.6.3.lcad appimage-screen.png

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-screen
          path: appimage-screen.png
          if-no-files-found: ignore
          retention-days: 14

  # LCAD as a Flatpak, on KDE's runtime from Flathub, with Open CASCADE built for it; then
  # installed and started, as the AppImage is.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak, a virtual display, and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb imagemagick
          # Ubuntu keeps unprivileged programs from making the namespaces Flatpak's sandbox
          # is built from.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Open CASCADE takes most of an hour to build. flatpak-builder keeps each module it built,
      # and builds again only those whose part of the manifest changed; that store is kept here
      # from one run to the next, and saved straight after the build, so that a failure further
      # on does not throw it away.
      - name: Take what was built of the dependencies before
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: flatpak/state
          key: flatpak-${{ hashFiles('packaging/flatpak/*.yml') }}
          restore-keys: flatpak-

      - name: Build the Flatpak
        run: ./scripts/build-flatpak.sh flatpak

      # Also when LCAD itself fails to build: the modules built before it are kept all the same.
      - name: Keep what was built of the dependencies
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: flatpak/state
          key: flatpak-${{ hashFiles('packaging/flatpak/*.yml') }}

      - name: Install it and start LCAD from it
        run: |
          flatpak install --user -y --noninteractive flatpak/LCAD-*.flatpak
          ./scripts/smoke-test-flatpak.sh tests/models/format-1/primitives-occt-7.6.3.lcad \
              flatpak-screen.png

      - name: Keep the Flatpak and the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LCAD-Flatpak
          path: |
            flatpak/LCAD-*.flatpak
            flatpak-screen.png
          if-no-files-found: ignore
          retention-days: 14
